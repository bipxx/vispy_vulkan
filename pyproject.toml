[build-system]
requires = [
    "scikit-build-core==0.11.6", "nanobind==3.1.0", "cmake==4.4.4",
    "Cython==3.1.5", "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.6; python_version == '3.11'",
    "numpy==2.5.3; python_version >= '3.12'",
]
build-backend = "scikit_build_core.build"

[project]
name = "vispy"
version = "0.17.0+vulkan.1"
description = "VisPy 0.17.0 compatibility fork using Dawn for Vulkan on Windows/Linux and Metal on macOS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-BSD", "LICENSING.md", "third_party/licenses/*.txt"]
authors = [{ name = "Vispy contributors" }]
dependencies = [
    "numpy",
    "freetype-py",
    "hsluv",
    "kiwisolver",
    "packaging",
]

[project.optional-dependencies]
# Newer Qt5 runtime releases do not provide Windows wheels.
pyqt5 = [
    "PyQt5",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "PyQt5-Qt5==5.15.19; sys_platform != 'win32'",
]
pyqt6 = ["PyQt6"]
pyside6 = ["PySide6"]
test = ["pytest", "pillow"]

[dependency-groups]
dev = ["pytest", "pillow", "tomli; python_version < '3.11'"]
build = ["scikit-build-core==0.11.6", "nanobind==3.1.0", "cmake==4.4.4", "Cython==3.1.5"]
# Windows qualification uses one Qt binding. Other bindings/hosts are installed
# in separate environments, so synchronizing this group cannot remove napari.
hosts = ["napari==0.9.2; python_version >= '3.11'", "PyQt6==6.11.0; python_version >= '3.11'", "numba==0.68.0; python_version >= '3.11'"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
editable.mode = "redirect"
cmake.build-type = "Release"
wheel.packages = ["src/vispy"]
# The explicit shipping contract retains gl2/glplus as Dawn aliases while the
# unported OpenGL loaders/backends remain source/reference-only.
wheel.exclude = [
    "vispy/gloo/gl/es2.py", "vispy/gloo/gl/_pyopengl2.py", "vispy/gloo/gl/pyopengl2.py",
    "vispy/ext/egl.py", "vispy/ext/osmesa.py", "vispy/util/osmesa_gl.py",
    "vispy/app/backends/_pyqt4.py", "vispy/app/backends/_pyside.py", "vispy/app/backends/_pyside2.py",
    "vispy/app/backends/_pyglet.py", "vispy/app/backends/_glfw.py", "vispy/app/backends/_sdl2.py",
    "vispy/app/backends/_wx.py", "vispy/app/backends/_egl.py", "vispy/app/backends/_osmesa.py",
    "vispy/app/backends/_tk.py",
]
# Dawn's Git ignores describe fetched dependencies, which this fork vendors.
# Explicit includes precede excludes in scikit-build-core, so keep generated
# files outside the include selection as well as the exclusion selection.
sdist.include = [
    "third_party/dawn/third_party/abseil-cpp/**",
    "third_party/dawn/third_party/glslang/src/**",
    "third_party/dawn/third_party/spirv-headers/src/**",
    "third_party/dawn/third_party/spirv-tools/src/**",
    "third_party/dawn/third_party/vulkan-headers/src/**",
    "third_party/dawn/third_party/vulkan-loader/src/**",
    "third_party/dawn/third_party/vulkan-utility-libraries/src/**",
    "third_party/dawn/third_party/jinja2/**",
    "third_party/dawn/third_party/markupsafe/**",
    "third_party/dawn/tools/android/gradle/wrapper/gradle-wrapper.properties",
    "!**/.git", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo",
    "!**/build/**", "!**/out/**", "!**/.cache/**",
]
sdist.exclude = ["build/**", "dist/**", ".venv/**", "**/__pycache__/**", "**/*.pyc", "**/*.pyo", "**/.git/**", "**/build/**", "**/out/**", "**/.cache/**", "src/vispy/**/*.pyd", "src/vispy/**/*.dll", "src/vispy/**/*.so", "src/vispy/VkLayer_vispy_submit.json"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
VISPY_INPLACE = "OFF"
VISPY_VERIFY_DEPENDENCIES = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires the Dawn Vulkan device (a skip is not a pass)",
    "wheel: requires a freshly built wheel and tests an isolated external consumer",
]
