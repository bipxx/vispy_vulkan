<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>VisPy WebGPU W0</title>
<canvas id="spike" width="4" height="4" aria-label="WebGPU pixel test"></canvas>
<pre id="result"></pre>
<script type="module">
import createSpike from "./spike.mjs";
import { loadPyodide } from "/pyodide/pyodide.mjs";

const report = { userAgent: navigator.userAgent, checks: [], diagnostics: [] };
try {
    if (!navigator.gpu || !WebAssembly.promising || !WebAssembly.Suspending) {
        throw new Error("WebGPU and WebAssembly JSPI are required");
    }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error("Chrome returned no WebGPU adapter");
    const { vendor, architecture, isFallbackAdapter } = adapter.info;
    report.adapter = { vendor, architecture, isFallbackAdapter };
    const wasm = await createSpike({ printErr: line => report.diagnostics.push(line) });
    const python = await loadPyodide({ indexURL: new URL("/pyodide/", location.href).href });
    const shaders = await Promise.all(["vert", "frag"].map(async stage => {
        if (!new URLSearchParams(location.search).has("shader")) return null;
        const response = await fetch(`./mesh.${stage}.wgsl`);
        if (!response.ok) throw new Error(`WGSL ${stage} HTTP ${response.status}`);
        return response.text();
    }));
    python.registerJsModule("spike", {
        readPixel: async (draw, cancel) => (await wasm.ccall(
            "read_pixel", "number", ["string", "string", "string", "number"],
            ["#spike", draw ? shaders[0] : null, draw ? shaders[1] : null, Number(cancel)],
            { async: true },
        )) >>> 0,
        hasShader: shaders[0] !== null,
        record: (name, pixel) => report.checks.push({ name, pixel }),
    });
    report.pyodide = python.version;
    await python.runPythonAsync(`
from pyodide.ffi import can_run_sync, run_sync
from spike import hasShader, readPixel, record

def check(name, expected, *, draw=False, cancel=False):
    pixel = run_sync(readPixel(draw, cancel))
    record(name, hex(pixel))
    assert pixel in expected, (name, hex(pixel), expected)

assert can_run_sync()
check("clear", {0xff0066ff})
check("cancelled-map", {1}, cancel=True)
check("clear-after-cancel", {0xff0066ff})
if hasShader:
    mesh_pixel = {0x4066bfff}
    check("draw", mesh_pixel, draw=True)
    check("cancelled-draw-map", {1}, draw=True, cancel=True)
    check("draw-after-cancel", mesh_pixel, draw=True)
`);
    report.ok = true;
} catch (error) {
    report.ok = false;
    report.error = String(error.stack ?? error);
}
document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
await fetch("/result", { method: "POST", body: JSON.stringify(report) });
</script>
