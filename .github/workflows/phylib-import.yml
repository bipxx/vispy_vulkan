name: phylib Linux CPU import admission

on:
  workflow_call:
  push:
    paths:
      - '.github/workflows/phylib-import.yml'
      - '.github/workflows/qualification_gate.py'
      - 'tools/host_inventory.py'
      - 'tools/phylib_import_cell.py'
      - 'compat/hosts.lock.toml'
      - 'compat/host-environments/phylib*'
      - 'compat/qualifications/phylib/**'
  pull_request:
    paths:
      - '.github/workflows/phylib-import.yml'
      - '.github/workflows/qualification_gate.py'
      - 'tools/host_inventory.py'
      - 'tools/phylib_import_cell.py'
      - 'compat/hosts.lock.toml'
      - 'compat/host-environments/phylib*'
      - 'compat/qualifications/phylib/**'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  imports:
    # phylib has no rendering workload and never acquires a GPU admission.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Restore immutable vendor bytes
        shell: bash
        run: |
          printf '%s\n' '* -text -eol -filter -ident' > .git/info/attributes
          git config core.autocrlf false
          git config core.longpaths true
          git sparse-checkout disable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.8'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Require the hashed import-only environment
        run: |
          python .github/workflows/qualification_gate.py admission --host phylib --platform linux-x11 --python 3.12.8 --binding none --output build/evidence/phylib-admission.json
          uv venv build/ci-phylib-${{ github.run_id }} --python python
          python - <<'PY'
          import json, pathlib, subprocess
          from tools.host_inventory import fetch
          record = json.loads(pathlib.Path('build/evidence/phylib-admission.json').read_text())['admission']
          interpreter = 'build/ci-phylib-${{ github.run_id }}/bin/python'
          subprocess.run(['uv', 'pip', 'install', '--python', interpreter, '--require-hashes', '--only-binary', ':all:', '--requirements', record['requirements_file']], check=True)
          source = fetch('phylib', pathlib.Path('build/evidence/phylib-source'))
          subprocess.run([interpreter, '-I', '-B', 'tools/phylib_import_cell.py', '--source', str(source), '--output', 'build/evidence/phylib-import.json'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phylib-import-inventory
          path: build/evidence
          if-no-files-found: error
