name: Metal wheel build (no graphics qualification)

on:
  pull_request:
    paths:
      - '.github/workflows/metal-wheel.yml'
      - 'tools/audit_metal_wheel.py'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'cpp/**'
      - 'src/**'
      - 'third_party/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Metal wheel ${{ matrix.arch }} CPython 3.12.8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: build/metal-evidence-${{ matrix.arch }}
      NATIVE_BUILD: build/metal-native-${{ matrix.arch }}
      BUILD_ENV: build/metal-env-${{ matrix.arch }}
      CONSUMER_NAME: vispy-metal-consumer-${{ github.run_id }}-${{ matrix.arch }}
      UV_CACHE_NAME: vispy-metal-cache-${{ github.run_id }}-${{ matrix.arch }}
      UV_NO_CONFIG: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CMAKE_GENERATOR: Ninja
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: .github
      - name: Restore immutable vendor bytes
        run: |
          printf '%s\n' '* -text -eol -filter -ident' > .git/info/attributes
          git config core.autocrlf false
          git sparse-checkout disable
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Prepare exact build tools
        run: |
          mkdir -p "$EVIDENCE"
          export UV_CACHE_DIR="$RUNNER_TEMP/$UV_CACHE_NAME"
          echo "UV_CACHE_DIR=$UV_CACHE_DIR" >> "$GITHUB_ENV"
          uv python install '3.12.8'
          uv venv "$BUILD_ENV" --python '3.12.8' --managed-python
          echo "BUILD_PYTHON=$GITHUB_WORKSPACE/$BUILD_ENV/bin/python" >> "$GITHUB_ENV"
          uv export --locked --no-default-groups --group dev --group build --no-emit-project --output-file "$EVIDENCE/build-requirements.txt" > /dev/null
          uv pip install --python "$BUILD_ENV" --require-hashes --only-binary :all: --requirements "$EVIDENCE/build-requirements.txt"
          echo "$GITHUB_WORKSPACE/$BUILD_ENV/bin" >> "$GITHUB_PATH"
          uv --version > "$EVIDENCE/uv-version.txt"
          ninja --version > "$EVIDENCE/ninja-version.txt"
          xcodebuild -version > "$EVIDENCE/xcode-version.txt"
          git rev-parse HEAD > "$EVIDENCE/source-revision.txt"
      - name: Build native Metal renderer wheel
        run: |
          "$BUILD_PYTHON" cmake/verify_dependencies.py
          uv build --python "$BUILD_PYTHON" --no-build-isolation --wheel --out-dir "$EVIDENCE/wheels" \
            --config-setting "build-dir=$NATIVE_BUILD" \
            --config-setting cmake.define.VISPY_INPLACE=OFF \
            --config-setting cmake.define.VISPY_CPU_CONTRACTS_ONLY=OFF \
            --config-setting cmake.define.VISPY_BUILD_CONTRACT_TESTS=OFF \
            --config-setting cmake.define.VISPY_VERIFY_DEPENDENCIES=ON \
            --config-setting 'cmake.define.CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}' \
            2>&1 | tee "$EVIDENCE/wheel-build.log"
      - name: Audit architecture, native origins, package and licenses
        run: |
          wheels=( "$EVIDENCE"/wheels/*.whl )
          test "${#wheels[@]}" -eq 1
          "$BUILD_PYTHON" -B tools/audit_metal_wheel.py archive --arch '${{ matrix.arch }}' \
            --wheel "${wheels[0]}" --build-dir "$NATIVE_BUILD" --output "$EVIDENCE/archive.json"
      - name: Install isolated consumer and check compiled CPU extensions
        run: |
          consumer="$RUNNER_TEMP/$CONSUMER_NAME"
          uv venv "$consumer" --python "$BUILD_PYTHON"
          uv export --locked --no-default-groups --no-emit-project --output-file "$EVIDENCE/runtime-requirements.txt" > /dev/null
          uv pip install --python "$consumer/bin/python" --require-hashes --only-binary :all: \
            --requirements "$EVIDENCE/runtime-requirements.txt" --requirements "$EVIDENCE/wheel-requirements.txt"
          "$consumer/bin/python" -I -B tools/audit_metal_wheel.py consumer --arch '${{ matrix.arch }}' \
            --archive-report "$EVIDENCE/archive.json" --output "$EVIDENCE/consumer.json"
      - name: Remove owned temporary environments, caches and objects
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          evidence = pathlib.Path(os.environ['EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=True)
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          removed = []
          for key in ('CONSUMER_NAME', 'UV_CACHE_NAME'):
              path = (temporary / os.environ[key]).resolve()
              if path.parent != temporary or not path.name.startswith('vispy-metal-'):
                  raise RuntimeError('Unexpected owned temporary path')
              if path.exists():
                  shutil.rmtree(path)
                  removed.append(str(path))
          build = pathlib.Path(os.environ['NATIVE_BUILD']).resolve()
          if build.parent != pathlib.Path('build').resolve() or not build.name.startswith('metal-native-'):
              raise RuntimeError('Unexpected native build path')
          objects = list(build.rglob('*.o')) if build.exists() else []
          for path in objects:
              if not path.resolve().is_relative_to(build) or path.is_symlink():
                  raise RuntimeError('Unexpected object path')
              path.unlink()
          environment = pathlib.Path(os.environ['BUILD_ENV']).resolve()
          if environment.parent != pathlib.Path('build').resolve() or not environment.name.startswith('metal-env-'):
              raise RuntimeError('Unexpected build environment path')
          if environment.exists():
              shutil.rmtree(environment)
              removed.append(str(environment))
          (evidence / 'cleanup.json').write_text(json.dumps({'objects_removed': len(objects), 'removed': removed}, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: metal-wheel-${{ matrix.arch }}-cp312
          path: |
            ${{ env.EVIDENCE }}
            ${{ env.NATIVE_BUILD }}/CMakeCache.txt
            ${{ env.NATIVE_BUILD }}/_dawn*.so
            ${{ env.NATIVE_BUILD }}/_sdf_cpu*.so
          if-no-files-found: error
