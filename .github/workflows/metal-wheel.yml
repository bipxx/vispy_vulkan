name: Metal wheel build (no graphics qualification)

on:
  pull_request:
    paths:
      - '.github/workflows/metal-wheel.yml'
      - 'tools/audit_metal_wheel.py'
      - 'tools/reuse_metal_ci.py'
      - 'tools/reuse_linux_ci.py'
      - 'tools/repackage_python_wheel.py'
      - 'tools/qualification_artifact.py'
      - 'tools/linux_ci_lifecycle.py'
      - 'compat/metal-ci-reuse.json'
      - 'compat/build-profiles/metal-ci-native.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'cpp/**'
      - 'src/**'
      - 'third_party/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      native_mode:
        description: 'Reuse verified build-only inputs; fresh requires a changed-input or missing-proof decision'
        type: choice
        required: true
        default: reuse
        options: [reuse, fresh]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Metal wheel ${{ matrix.arch }} CPython 3.12.8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    defaults:
      run:
        shell: bash
    env:
      UV_NO_CONFIG: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CMAKE_GENERATOR: Ninja
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NATIVE_MODE: ${{ github.event.inputs.native_mode || 'reuse' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: .github
      - name: Restore immutable vendor bytes
        run: |
          printf '%s\n' '* -text -eol -filter -ident' > .git/info/attributes
          git config core.autocrlf false
          git sparse-checkout disable
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Register the external managed Metal workspace
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          native_run="metal-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}"
          workspace="$RUNNER_TEMP/vispy-metal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}"
          case "$NATIVE_MODE" in reuse) peak=1073741824 ;; fresh) peak=6442450944 ;; *) exit 1 ;; esac
          echo "NATIVE_RUN=$native_run" >> "$GITHUB_ENV"
          echo "CI_STATE=$workspace/build/runs/$native_run/state.json" >> "$GITHUB_ENV"
          python3 -B tools/linux_ci_lifecycle.py init --workspace "$workspace" \
            --run-id "$native_run" --expected-peak-bytes "$peak"
      - name: Prepare exact Python and record current CI identity
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase prepare --script-stdin <<'PHASE'
          uv python install '3.12.8'
          uv venv "$BUILD_ENV" --python '3.12.8' --managed-python
          echo "$BUILD_ENV/bin" >> "$GITHUB_PATH"
          uv --version > "$EVIDENCE/uv-version.txt"
          git rev-parse HEAD > "$EVIDENCE/source-revision.txt"
          "$BUILD_PYTHON" -B tools/qualification_ci.py --capture --workflow .github/workflows/metal-wheel.yml --job-name "Metal wheel ${{ matrix.arch }} CPython 3.12.8" --output "$EVIDENCE/ci-identity.json"
          PHASE
      - name: Verify current pinned dependency bytes
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase dependency-before -- "$BUILD_PYTHON" -B cmake/verify_dependencies.py
      - name: Verify and reuse original Metal build-only artifact
        if: env.NATIVE_MODE == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase reuse -- \
            "$BUILD_PYTHON" -B tools/reuse_metal_ci.py --workspace "$DRIVER_WORKSPACE" \
              --run-id "$NATIVE_RUN" --owner ci --arch '${{ matrix.arch }}' --package-current-python --keep-original-description
      - name: Prepare explicit fresh native build tools
        if: env.NATIVE_MODE == 'fresh'
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase build-tools --script-stdin <<'PHASE'
          uv export --locked --no-default-groups --group dev --group build --no-emit-project --output-file "$EVIDENCE/build-requirements.txt" > /dev/null
          uv pip install --python "$BUILD_ENV" --require-hashes --only-binary :all: --requirements "$EVIDENCE/build-requirements.txt"
          ninja --version > "$EVIDENCE/ninja-version.txt"
          xcodebuild -version > "$EVIDENCE/xcode-version.txt"
          PHASE
      - name: Build and audit explicit fresh Metal wheel
        if: env.NATIVE_MODE == 'fresh'
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase wheel-build -- uv build --python "$BUILD_PYTHON" --no-build-isolation --wheel --out-dir "$EVIDENCE/wheels" \
            --config-setting "build-dir=$NATIVE_BUILD" \
            --config-setting cmake.define.VISPY_INPLACE=OFF \
            --config-setting cmake.define.VISPY_CPU_CONTRACTS_ONLY=OFF \
            --config-setting cmake.define.VISPY_BUILD_CONTRACT_TESTS=OFF \
            --config-setting cmake.define.VISPY_VERIFY_DEPENDENCIES=ON \
            --config-setting 'cmake.define.CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}'
          wheels=( "$EVIDENCE"/wheels/*.whl )
          test "${#wheels[@]}" -eq 1
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase archive -- "$BUILD_PYTHON" -B tools/audit_metal_wheel.py archive --arch '${{ matrix.arch }}' \
            --wheel "${wheels[0]}" --build-dir "$NATIVE_BUILD" --output "$EVIDENCE/archive.json"
          echo "ARCHIVE_REPORT=$EVIDENCE/archive.json" >> "$GITHUB_ENV"
      - name: Install isolated consumer and rerun compiled CPU controls
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase consumer --script-stdin <<'PHASE'
          uv venv "$CONSUMER_PATH" --python "$BUILD_PYTHON"
          uv export --locked --no-default-groups --no-emit-project --output-file "$EVIDENCE/runtime-requirements.txt" > /dev/null
          uv pip install --python "$CONSUMER_PATH/bin/python" --require-hashes --only-binary :all: \
            --requirements "$EVIDENCE/runtime-requirements.txt" --requirements "$EVIDENCE/wheel-requirements.txt"
          "$CONSUMER_PATH/bin/python" -I -B tools/audit_metal_wheel.py consumer --arch '${{ matrix.arch }}' \
            --archive-report "$ARCHIVE_REPORT" --output "$EVIDENCE/consumer.json"
          PHASE
      - name: Verify current dependency bytes after consumer controls
        run: |
          python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" run --phase dependency-after -- "$BUILD_PYTHON" -B cmake/verify_dependencies.py
      - name: Retain source, originals and results; clean registered scratch
        if: always()
        run: |
          if [[ -n "${CI_STATE:-}" && -f "$CI_STATE" ]]; then
            python3 -B tools/linux_ci_lifecycle.py --state "$CI_STATE" finish
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: metal-wheel-${{ matrix.arch }}-cp312
          include-hidden-files: true
          path: |
            ${{ env.EVIDENCE }}
            ${{ env.DRIVER_WORKSPACE }}/build/artifacts/
          if-no-files-found: error
