name: Host admission (missing locks or upstream fixtures fail)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admitted-renderer-host:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python: ['3.10.19', '3.11.14', '3.12.8', '3.13.8', '3.14.0']
        host: [napari, glue_vispy_viewers, dive, napari_threedee, visbrain]
        binding: [pyqt5, pyqt6, pyside6]
        target:
          - {name: windows, labels: [self-hosted, Windows, X64, vispy-vulkan-hardware], architecture: x64, backend: Vulkan}
          - {name: linux-x11, labels: [self-hosted, Linux, X64, vispy-vulkan-hardware, x11-desktop], architecture: x64, backend: Vulkan}
          - {name: macos13-arm64, labels: [self-hosted, macOS, ARM64, macos-13, vispy-metal-hardware], architecture: arm64, backend: Metal}
          - {name: macos13-x86_64, labels: [self-hosted, macOS, X64, macos-13, vispy-metal-hardware], architecture: x64, backend: Metal}
        exclude:
          # napari 0.9.2 requires Python >=3.11; this row is outside its
          # supported interpreter contract and has no invented rendering pass.
          - {host: napari, python: '3.10.19'}
    uses: ./.github/workflows/native-qualification.yml
    with:
      cell: host-${{ matrix.host }}-${{ matrix.target.name }}-${{ matrix.python }}-${{ matrix.binding }}
      platform: ${{ matrix.target.name }}
      runner_labels: ${{ toJSON(matrix.target.labels) }}
      architecture: ${{ matrix.target.architecture }}
      python: ${{ matrix.python }}
      binding: ${{ matrix.binding }}
      backend: ${{ matrix.target.backend }}
      mode: host
      host: ${{ matrix.host }}

  phylib-import-inventory:
    uses: ./.github/workflows/phylib-import.yml
