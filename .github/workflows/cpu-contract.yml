name: CPU contracts (no platform admission)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU ${{ matrix.target.name }} CPython ${{ matrix.python }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: ${{ matrix.target.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10.19', '3.11.14', '3.12.8', '3.13.8', '3.14.0']
        target:
          - {name: windows-x86_64, runner: windows-2022, arch: x64, timeout_minutes: 60}
          - {name: linux-x86_64, runner: ubuntu-24.04, arch: x64, timeout_minutes: 60}
          - {name: macos-arm64, runner: macos-15, arch: arm64, timeout_minutes: 60}
          - {name: macos-x86_64, runner: macos-15-intel, arch: x64, timeout_minutes: 90}
    defaults:
      run:
        shell: bash
    env:
      UV_PROJECT_ENVIRONMENT: build/ci-env-${{ github.run_id }}-${{ matrix.target.name }}-${{ matrix.python }}
      PYTHONPATH: ${{ github.workspace }}/src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      EVIDENCE: build/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: .github
      - name: Restore immutable vendor bytes
        shell: bash
        run: |
          printf '%s\n' '* -text -eol -filter -ident' > .git/info/attributes
          git config core.autocrlf false
          git config core.longpaths true
          git sparse-checkout disable
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Install exact managed CPython
        run: |
          mkdir -p "$EVIDENCE"
          uv --version > "$EVIDENCE/uv-version.txt"
          uv python install '${{ matrix.python }}'
      - name: Install exact hashed CPU/build dependencies in a job-owned environment
        run: |
          mkdir -p "$EVIDENCE"
          uv lock --check
          uv venv "$UV_PROJECT_ENVIRONMENT" --python '${{ matrix.python }}' --managed-python
          uv run --no-project --python '${{ matrix.python }}' --managed-python python - <<'PY'
          import os
          from pathlib import Path
          environment = Path(os.environ['UV_PROJECT_ENVIRONMENT']).resolve()
          binary = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write(f'CI_PYTHON={binary.as_posix()}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as file:
              file.write(str(binary.parent) + '\n')
          PY
          uv export --locked --no-default-groups --group dev --group build --no-emit-project --output-file "$EVIDENCE/requirements.txt" > /dev/null
          uv pip install --python "$UV_PROJECT_ENVIRONMENT" --require-hashes --only-binary :all: --requirements "$EVIDENCE/requirements.txt"
      - name: Execute native epoch and license snapshot regressions before compilation
        run: |
          "$CI_PYTHON" .github/workflows/qualification_gate.py pytest --output "$EVIDENCE/build-hygiene.json" -- -q tests/contract/test_build_hygiene.py --junitxml="$EVIDENCE/build-hygiene.xml"
          "$CI_PYTHON" .github/workflows/qualification_gate.py pytest --output "$EVIDENCE/native-epoch-guards.json" -- -q tests/contract/test_native_epoch_guards.py --junitxml="$EVIDENCE/native-epoch-guards.xml"
      - name: Validate draft compatibility inventory and promotion negative controls
        run: |
          "$CI_PYTHON" -B tools/qualification_ci.py --capture --workflow .github/workflows/cpu-contract.yml --job-name "CPU ${{ matrix.target.name }} CPython ${{ matrix.python }}" --output "$EVIDENCE/ci-identity.json"
          "$CI_PYTHON" -B tools/compatibility_inventory.py
          "$CI_PYTHON" -B tools/compatibility_candidate.py
          "$CI_PYTHON" -B tools/compatibility_coverage.py
          "$CI_PYTHON" -B tools/compatibility_execution.py
          "$CI_PYTHON" -B .github/workflows/qualification_gate.py pytest --output "$EVIDENCE/compatibility-inventory.json" -- -q -p no:cacheprovider tests/contract/test_compatibility_inventory.py tests/contract/test_compatibility_qualification.py tests/contract/test_qualification_ci.py tests/contract/test_qualification_artifact.py tests/contract/test_qualification_native.py tests/contract/test_qualification_epoch.py tests/contract/test_qualification_index.py tests/contract/test_prepare_software_vulkan.py tests/contract/test_build_software_vulkan.py tests/contract/test_dawn_submission_contract.py tests/contract/test_dawn_state_query_contract.py tests/no_opengl/test_probe_failures.py tests/no_opengl/test_functional_results.py --junitxml="$EVIDENCE/compatibility-inventory.xml"
      - name: Verify immutable scientific references and isolated consumer controls without graphics
        run: |
          "$CI_PYTHON" .github/workflows/qualification_gate.py pytest --output "$EVIDENCE/scientific-wheel-cpu.json" -- -q tests/contract/test_mesh_layout_authoring.py tests/contract/test_mesh_layout_reference.py tests/contract/test_mesh_layout_wheel_consumer.py tests/contract/test_mesh_layout_process.py tests/contract/test_image_wheel_reference.py tests/contract/test_image_wheel_runner.py tests/contract/test_volume_wheel_reference.py tests/contract/test_volume_wheel_runner.py tests/contract/test_glue_wheel_suite.py tests/contract/test_glue_host_cell.py tests/contract/test_phylib_import_cell.py tests/contract/test_napari_plugin_wheel_suite.py tests/contract/test_napari_plugin_host_cell.py tests/contract/test_color_volume.py tests/contract/test_color_volume_wheel_suite.py tests/contract/test_color_volume_linux_wheel_suite.py tests/contract/test_large_image.py tests/contract/test_large_image_wheel_suite.py tests/contract/test_large_image_reference.py tests/contract/test_large_volume.py tests/contract/test_large_volume_wheel_suite.py tests/contract/test_large_volume_reference.py tests/contract/test_volume_scientific_admission.py tests/benchmarks/test_volume_geometry_causality.py tests/benchmarks/test_volume_benchmark_geometry2.py tests/benchmarks/test_volume_benchmark_pairs2.py tests/benchmarks/test_volume_benchmark_pairs.py tests/benchmarks/test_volume_benchmark_adapter.py tests/benchmarks/test_frame_metrics.py tests/hosts/test_glue_parity.py --junitxml="$EVIDENCE/scientific-wheel-cpu.xml"
      - name: Capture environment and verify immutable native source trees
        run: |
          "$CI_PYTHON" .github/workflows/qualification_gate.py capture --output "$EVIDENCE/environment.json"
          "$CI_PYTHON" cmake/verify_dependencies.py
      - name: Configure CPU extension and build every registered native CPU contract
        run: |
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            cmake -S . -B build/ci-native -G 'Visual Studio 17 2022' -A x64 -DPython_EXECUTABLE="$CI_PYTHON" -DPython3_EXECUTABLE="$CI_PYTHON" -DVISPY_INPLACE=ON -DVISPY_VERIFY_DEPENDENCIES=ON -DVISPY_BUILD_CONTRACT_TESTS=ON -DVISPY_CPU_CONTRACTS_ONLY=ON
          else
            cmake -S . -B build/ci-native -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$CI_PYTHON" -DPython3_EXECUTABLE="$CI_PYTHON" -DVISPY_INPLACE=ON -DVISPY_VERIFY_DEPENDENCIES=ON -DVISPY_BUILD_CONTRACT_TESTS=ON -DVISPY_CPU_CONTRACTS_ONLY=ON
          fi
          cmake --build build/ci-native --config Release --parallel 3
          ctest --test-dir build/ci-native -C Release --output-on-failure --no-tests=error
      - name: Execute original CPU assertions and CPU contract cases
        run: |
          "$CI_PYTHON" .github/workflows/qualification_gate.py pytest --output "$EVIDENCE/pytest.json" -- -q tests/contract/test_sdf_cpu.py tests/shaders/test_program_array_shapes.py tests/shaders/test_variable_arrays.py tests/shaders/test_matrix_attribute_packing.py tests/contract/test_package_inputs.py tests/contract/test_dependency_origin_hashing.py tests/contract/test_archive_metadata.py tests/contract/test_source_distribution.py tests/contract/test_source_manifest.py tests/contract/test_reference_inventory.py tests/contract/test_host_inventory.py::test_pinned_host_source_and_environment_evidence_are_consistent tests/contract/test_upstream_qt_lifecycle.py src/vispy/color/tests/test_color.py src/vispy/geometry/tests/test_generation.py src/vispy/geometry/tests/test_meshdata.py src/vispy/geometry/tests/test_calculations.py src/vispy/util/tests/test_fourier.py src/vispy/util/tests/test_transforms.py src/vispy/util/tests/test_event_emitter.py src/vispy/util/tests/test_emitter_group.py src/vispy/util/tests/test_key.py src/vispy/util/tests/test_logging.py --junitxml=build/evidence/pytest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpu-${{ matrix.target.name }}-${{ matrix.python }}
          path: |
            build/evidence
            build/ci-native/CMakeCache.txt
            build/ci-native/Testing/Temporary/LastTest.log
          if-no-files-found: error
